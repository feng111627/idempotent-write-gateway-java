server.port=0

# ===== 幂等写网关配置 =====
# 分状态保留时长（推荐用法）：
# 处理中记录：留短一点，避免键被长时间占着（默认 2m）
idempotency.processing-ttl=2m
# 成功记录：留久一点，方便同键重试时重放首次结果（默认 24h）
idempotency.succeeded-ttl=24h
# 失败记录：保留一个够用的重试窗口（默认 30m）
idempotency.failed-ttl=30m
# 内存存储最多保留的记录条数（默认 10000）
idempotency.max-records=10000
# 幂等键允许的最大长度
idempotency.max-key-length=128

# ----- 老用法（兼容）：三段统一时长，与上面的分状态配置二选一，不能同时配置 -----
# idempotency.ttl=24h
