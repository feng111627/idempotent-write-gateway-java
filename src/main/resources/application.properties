server.port=0

# ===== 幂等网关配置 =====
# 幂等键请求头名称
idempotency.header-name=Idempotency-Key
# 幂等键格式：8~128 位字母/数字/下划线/中划线
idempotency.key-pattern=^[A-Za-z0-9_-]{8,128}$
# 成功记录保留时长，过期后同键可重新处理
idempotency.success-ttl=PT24H
# 失败记录保留时长：TTL 内同键重试返回相同失败；过期后允许真正重试
idempotency.failure-ttl=PT5M
# 处理中记录的租约时长（崩溃兜底，超过后视为过期可抢占）
idempotency.processing-ttl=PT10M
# 过期记录清理周期
idempotency.cleanup-interval=PT1M
# 存储不可用时是否 fail-closed（true=拒绝请求保护业务，不执行业务）
idempotency.storage-fail-closed=true
