server.port=0

# ===== 幂等写网关配置（以下均为默认值，按需放开覆盖）=====
# 分状态保留时长（推荐）：状态切换时按新状态重新起算窗口
# 处理中：短一些，别长时间占着键（默认 2m）
# idempotency.processing-ttl=2m
# 失败：保留一个够用的重试窗口（默认 30m）
# idempotency.failed-ttl=30m
# 成功：留久一点方便窗口内重放（默认 24h）
# idempotency.succeeded-ttl=24h
#
# 老配置（兼容，可继续使用）：只配它时三段窗口统一取该值，
# 且沿用旧语义——从抢占成功时刻起算的固定截止时间，状态切换不重算窗口。
# idempotency.ttl=24h
#
# “处理中”响应建议的客户端轮询间隔（窗口已过但首请仍在跑时也用它兜底）
# idempotency.processing-retry-after=2s
# 幂等键允许的最大长度
# idempotency.max-key-length=128
# 内存存储记录条数上限，满后先清过期、再淘汰最老的终态记录
# idempotency.max-records=10000
